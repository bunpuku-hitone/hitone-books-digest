<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>いちにち | 令和細見舎</title>
<style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#4a3b24;background:#fff9e8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:800px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:1.5rem;margin:10px 0}a{color:#80601e}.sub{color:#827354;font-size:.85rem}.panel{background:#fffdf5;border:1px solid #eadfbd;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #80601e0a}input,textarea,select{font:inherit;border:1px solid #d9cba5;border-radius:9px;padding:11px;background:#fffdf5;color:#4a3b24}input,textarea{width:100%}textarea{min-height:85px;resize:vertical}button{font:inherit;border:0;border-radius:10px;padding:10px 15px;cursor:pointer;background:#80601e;color:white}button.secondary{background:#f6ebc9;color:#655022}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.memo{border:1px solid #e8d8a8;background:#fff4d3;border-radius:13px;margin:10px 0;overflow:hidden}.memo-head{width:100%;text-align:left;background:transparent;color:#4a3b24;padding:14px;display:flex;gap:12px;align-items:center}.memo-head .time{font-weight:700;white-space:nowrap;color:#80601e}.memo-head .summary{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}.memo-head .arrow{color:#8a7952}.memo-editor{padding:0 14px 14px}.memo-editor textarea{margin-top:10px}.memo-editor .row{margin-top:10px}.hint{font-size:.88rem;color:#7a6b4b}.status{min-height:1.5em;font-size:.9rem}.footer{padding:20px 0;text-align:center}label{display:block;margin:12px 0 5px;font-size:.9rem}input[type=checkbox]{width:auto}.clock{display:flex;align-items:center;gap:7px}.clock select{width:90px}.empty{color:#8a7952;text-align:center;padding:15px}@media(max-width:480px){.wrap{padding:10px}.panel{padding:12px}header a{font-size:.8rem}}
</style></head><body><main class="wrap">
<header><h1>いちにち ☀️</h1><a href="https://bunpuku-hitone.github.io/hitone-books-digest/">あい右衛門・令和細見舎</a></header>
<section class="panel"><div class="row"><input type="date" id="day" aria-label="メモの日付" style="font-weight:700"></div></section>
<section class="panel"><strong>新しい予定・時刻</strong><div class="clock" id="newClock" style="margin-bottom:1.5em"></div><textarea id="draft" placeholder="予定・メモを入力…"></textarea><div style="margin-top:10px"><button id="add" style="width:100%">メモを ENTER</button></div></section>
<section class="panel"><strong>いちにちのメモ</strong><div id="notes" aria-label="メモ一覧"></div></section>
<section class="panel"><h2 style="font-size:1.1rem">いちにちのメモをメール送信する</h2><input aria-label="お名前" id="person" autocomplete="name" placeholder="お名前"><label for="email">送信先メールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"><label><input id="newsletter" type="checkbox"> 令和細見舎からのお知らせをメールで受け取る（任意）</label><div class="row"><button id="sendDirect">メモをメール送信</button><button id="reset" class="secondary">メモを消去する</button></div><p id="status" class="status" role="status"></p></section>
<p class="footer sub">あい右衛門令和細見舎</p></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='aiuemon-ichinichi-v1',pad=n=>String(n).padStart(2,'0');const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};$('day').value=today();let records={};try{const data=JSON.parse(localStorage.getItem(key)||'{}');if(data&&typeof data==='object'&&!Array.isArray(data))records=data}catch{}const persist=()=>{try{localStorage.setItem(key,JSON.stringify(records));return true}catch{$('status').textContent='保存できませんでした。端末の空き容量をご確認ください。';return false}};const items=()=>records[$('day').value]||[];const saveItems=arr=>{records[$('day').value]=arr;return persist()};const makeClock=(root,h,m)=>{const hour=document.createElement('select'),minute=document.createElement('select');hour.setAttribute('aria-label','時');minute.setAttribute('aria-label','分');for(let i=0;i<24;i++){const o=document.createElement('option');o.value=o.textContent=pad(i);hour.append(o)}for(let i=0;i<60;i++){const o=document.createElement('option');o.value=o.textContent=pad(i);minute.append(o)}hour.value=pad(h);minute.value=pad(m);const colon=document.createElement('span');colon.textContent='：';root.append(hour,colon,minute);return {hour,minute}};const now=new Date();const newClock=makeClock($('newClock'),now.getHours(),now.getMinutes());let opened=null;function render(){const root=$('notes');root.replaceChildren();const list=[...items()].sort((a,b)=>a.time.localeCompare(b.time)||a.order-b.order);if(!list.length){const p=document.createElement('p');p.className='empty';p.textContent='まだメモがありません。';root.append(p);return}for(const n of list){const box=document.createElement('div');box.className='memo';const head=document.createElement('button');head.type='button';head.className='memo-head';head.setAttribute('aria-expanded',String(opened===n.id));const time=document.createElement('span');time.className='time';time.textContent=n.time;const summary=document.createElement('span');summary.className='summary';summary.textContent=n.text;const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent=opened===n.id?'▲':'▽';head.append(time,summary,arrow);head.onclick=()=>{opened=opened===n.id?null:n.id;render()};box.append(head);if(opened===n.id){const editor=document.createElement('div');editor.className='memo-editor';const clock=document.createElement('div');clock.className='clock';const parts=n.time.split(':');const selectors=makeClock(clock,Number(parts[0]),Number(parts[1]));const area=document.createElement('textarea');area.value=n.text;area.setAttribute('aria-label','メモ内容を編集');const actions=document.createElement('div');actions.className='row';const update=document.createElement('button');update.textContent='更新';update.onclick=()=>{const v=area.value.trim();if(!v){$('status').textContent='メモ本文を入力してください。';return}n.time=selectors.hour.value+':'+selectors.minute.value;n.text=v;if(saveItems(items())){opened=null;render();$('status').textContent='メモを更新しました。'}};const cancel=document.createElement('button');cancel.className='secondary';cancel.textContent='閉じる';cancel.onclick=()=>{opened=null;render()};actions.append(update,cancel);editor.append(clock,area,actions);box.append(editor)}root.append(box)}}$('day').onchange=()=>{opened=null;render();$('status').textContent=''};$('add').onclick=()=>{const v=$('draft').value.trim();if(!v)return;const list=items();list.push({id:crypto.randomUUID(),time:newClock.hour.value+':'+newClock.minute.value,text:v,order:Date.now()});if(saveItems(list)){$('draft').value='';opened=null;render();$('status').textContent='メモを保存しました。'}};$('draft').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))$('add').click()};const exportText=()=> 'いちにち　'+$('day').value+'\n\n'+[...items()].sort((a,b)=>a.time.localeCompare(b.time)||a.order-b.order).map(n=>n.time+'　'+n.text).join('\n\n');$('sendDirect').onclick=async()=>{if(!items().length){$('status').textContent='メモがありません。';return}if(!$('person').value.trim()||!$('email').value.trim()||!$('email').checkValidity()){$('status').textContent='お名前と有効なメールアドレスを入力してください。';return}const btn=$('sendDirect');btn.disabled=true;$('status').textContent='送信しています…';try{const res=await fetch('https://aiuemon-mail.hitone-idobata.workers.dev/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:$('email').value.trim(),subject:'いちにち：'+$('day').value,text:exportText()})});let result={};try{result=await res.json()}catch{}$('status').textContent=res.ok&&!result.error?'送信APIが受け付けました。メールの到着を確認してください。':'送信できませんでした：'+(result.error||res.status)}catch{$('status').textContent='送信できませんでした。接続状態を確認してください。'}finally{btn.disabled=false}};$('reset').onclick=()=>{if(!confirm($('day').value+' のメモをすべて消去しますか？'))return;saveItems([]);opened=null;render();$('status').textContent='選択した日のメモを消去しました。'};render()})();
</script></body></html>
