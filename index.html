<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あい右衛門・令和細見舎</title>
<meta name="description" content="今月の話題とイベント掲示板">
<meta property="og:type" content="website">
<meta property="og:locale" content="ja_JP">
<meta property="og:site_name" content="あい右衛門・令和細見舎">
<meta property="og:title" content="あい右衛門・令和細見舎">
<meta property="og:description" content="今月の話題とイベント掲示板">
<meta property="og:url" content="https://bunpuku-hitone.github.io/hitone-books-digest/">
<meta property="og:image" content="https://bunpuku-hitone.github.io/hitone-books-digest/billboard-autumn.png">
<meta property="og:image:alt" content="あい右衛門・令和細見舎 今月の話題とイベント掲示板">
<meta name="twitter:card" content="summary_large_image">

<style>
*{box-sizing:border-box}
body{margin:0;background:#eee;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;color:#111}
main{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;padding:28px 16px 56px}
h1{text-align:center;font-size:28px;margin:8px 0 6px}
.lead{text-align:center;color:#777;margin:0 0 26px;font-size:15px}
.today{display:block;margin:0 0 28px;cursor:pointer}
.today img{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modal-box{position:relative;width:min(92vw,430px);aspect-ratio:9/16;background:#000}
.modal-box iframe{width:100%;height:100%;border:0}
.modal-close{position:absolute;right:-8px;top:-44px;border:0;background:#fff;color:#111;width:36px;height:36px;border-radius:50%;font-size:26px;line-height:34px;cursor:pointer}
#shelf{display:flex;flex-direction:column;gap:28px}
.book{display:block;text-decoration:none;color:inherit}
.cover{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.16)}
.tap{text-align:center;margin-top:9px;color:#777;font-size:14px}
.catalog-link{display:block;border:1px solid #bbb;border-radius:8px;padding:22px 14px;text-align:center;text-decoration:none;color:#333;background:#fafafa;font-size:18px;font-weight:700}
.catalog-link span{display:block;margin-top:6px;color:#777;font-size:13px;font-weight:400}
.next-link{margin-top:28px}
.coming{border:1px solid #ddd;border-radius:8px;padding:34px 12px;text-align:center;color:#777;background:#fafafa}
.coming strong{display:block;font-size:24px;letter-spacing:.04em;color:#444;margin-bottom:5px}
footer{text-align:center;color:#aaa;font-size:12px;margin-top:36px}
.admin-link{display:inline-block;margin-top:10px;color:#aaa;font-size:12px;text-decoration:none}
</style>
</head>
<body>
<main>
<img src="billboard-autumn.png" alt="あい右衛門ビルボード — 今月の話題とイベント掲示板" style="display:block;width:100%;height:auto;margin:0 0 18px">
<p class="lead">気になる表紙をタップ</p>
<a class="today" id="todayAiuemon" href="#" aria-label="今日のあい右衛門を再生">
  <img src="today-aiuemon.jpg" alt="今日のあい右衛門">
</a>
<a class="today" id="presentVideo" href="#" aria-label="プレゼント動画を再生">
  <img src="present-video.jpg" alt="プレゼント動画">
</a>
<div class="modal" id="todayModal" aria-hidden="true">
  <div class="modal-box">
    <button class="modal-close" id="todayClose" aria-label="閉じる">×</button>
    <iframe id="todayFrame" title="今日のあい右衛門" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </div>
</div>
<section id="shelf"></section>
<a class="catalog-link next-link" id="nextCatalog" href="#" hidden>
  次のWebカタログへ
  <span>16冊目の入口</span>
</a>
<a class="book" id="fullCatalog" href="https://bunpuku-hitone.github.io/hitone-books/" target="_blank" rel="noopener">
  <img class="cover" src="books-catalog-aiuemon.jpg" alt="雑談家ひとねの本 Webカタログへ">
  <div class="tap">画像をタップ → 本編の本棚を見る</div>
</a>
<footer>一冊ずつ、縦に並ぶスマホ本棚です。<br><a class="admin-link" href="admin.html">管理者</a></footer>
</main>
<script src="books.js"></script>
<script>
const API_URL = "https://aiuemon-web-1.onrender.com";
const shelf = document.getElementById("shelf");

const todayAiuemon = document.getElementById("todayAiuemon");
const todayModal = document.getElementById("todayModal");
const todayClose = document.getElementById("todayClose");
const todayFrame = document.getElementById("todayFrame");
let todayVideoId = "";
let presentVideoId = "";

fetch("Today.txt?ts=" + Date.now(), {cache:"no-store"})
  .then(r => r.text())
  .then(url => {
    const m = url.trim().match(/(?:shorts\/|youtu\.be\/|v=)([A-Za-z0-9_-]{11})/);
    if (m) todayVideoId = m[1];
  })
  .catch(() => {});

fetch("Present-video.txt?ts=" + Date.now(), {cache:"no-store"})
  .then(r => { if (!r.ok) throw new Error("Video link unavailable"); return r.text(); })
  .then(url => {
    const m = url.trim().match(/(?:shorts\/|youtu\.be\/|v=)([A-Za-z0-9_-]{11})/);
    if (m) presentVideoId = m[1];
  })
  .catch(() => {});

todayAiuemon.addEventListener("click", e => {
  e.preventDefault();
  if (!todayVideoId) return;
  todayFrame.title = "今日のあい右衛門";
  todayFrame.src = "https://www.youtube.com/embed/" + todayVideoId + "?autoplay=1&playsinline=1";
  todayModal.classList.add("open");
  todayModal.setAttribute("aria-hidden","false");
});
presentVideo.addEventListener("click", e => {
  e.preventDefault();
  if (!presentVideoId) return;
  todayFrame.title = "プレゼント動画";
  todayFrame.src = "https://www.youtube.com/embed/" + presentVideoId + "?autoplay=1&playsinline=1";
  todayModal.classList.add("open");
  todayModal.setAttribute("aria-hidden","false");
});
function closeToday(){
  todayModal.classList.remove("open");
  todayModal.setAttribute("aria-hidden","true");
  todayFrame.src = "";
}
todayClose.addEventListener("click", closeToday);
todayModal.addEventListener("click", e => { if(e.target === todayModal) closeToday(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeToday(); });

function addBook(b) {
  const a = document.createElement("a");
  a.className = "book";
  if (b.status === "coming") {
    a.href = b.detail || ("coming.html?book=" + b.no);
  } else {
    a.href = b.amazon || "#";
    a.target = "_blank";
    a.rel = "noopener";
  }
  a.addEventListener("click", () => {
    fetch(API_URL + "/catalog/click", {
      method: "POST",
      body: new URLSearchParams({book_no: String(b.no)}),
      keepalive: true
    }).catch(() => {});
  });
  const img = document.createElement("img");
  img.className = "cover";
  img.src = b.image;
  img.alt = b.title;
  const tap = document.createElement("div");
  tap.className = "tap";
  tap.textContent = b.status === "coming" ? "表紙をタップ → Coming Soon" : "表紙をタップ → Amazon";
  a.append(img, tap);
  shelf.appendChild(a);
}

const published = BOOKS.slice(0, 15);
const present3 = document.createElement("a");
present3.className = "book";
present3.id = "present3";
present3.href = "viewer3.html";
present3.innerHTML = '<img class="cover" src="present3.jpg" alt="魔法みたいな箱。売っています。"><div class="tap">画像をタップ → 90秒プレゼンテーションを読む</div>';
present3.addEventListener("click", () => {
  fetch(API_URL + "/catalog/click", {
    method: "POST",
    body: new URLSearchParams({book_no: "present3"}),
    keepalive: true
  }).catch(() => {});
});
shelf.appendChild(present3);

const adSample01 = document.createElement("a");
adSample01.className = "book";
adSample01.href = "https://www.facebook.com/share/p/1BymxHhtQy/?mibextid=wwXIfr";
adSample01.target = "_blank";
adSample01.rel = "noopener";
adSample01.innerHTML = '<img class="cover" src="ad-00001.jpg" alt="橋村佳奈美 TOP ARTIST CONTEST 2026 FINAL 決勝出場"><div class="tap">画像をタップ → Facebook告知ページを見る</div>';
shelf.appendChild(adSample01);

const book12 = published.find(b => b.no === 12);
if (book12) addBook(book12);

const book9 = published.find(b => b.no === 9);
if (book9) addBook(book9);

const present2 = document.createElement("a");
present2.className = "book";
present2.id = "present2";
present2.href = "viewer2.html";
present2.innerHTML = '<img class="cover" src="present2.jpg" alt="あなたの商品、必要な人に届いていますか？ あなたの商品告知パッケージ"><div class="tap">表紙をタップ → 商品告知パッケージを読む</div>';
present2.addEventListener("click", () => {
  fetch(API_URL + "/catalog/click", {
    method: "POST",
    body: new URLSearchParams({book_no: "present2"}),
    keepalive: true
  }).catch(() => {});
});
shelf.appendChild(present2);

published.filter(b => b.no !== 12 && b.no !== 9).forEach(addBook);

if (published.length === 0) {
  const c = document.createElement("div");
  c.className = "coming";
  c.innerHTML = "<strong>Coming Soon</strong>最初のダイジェスト版を準備中です";
  shelf.appendChild(c);
}
if (NEXT_CATALOG_URL) {
  const next = document.getElementById("nextCatalog");
  next.href = NEXT_CATALOG_URL;
  next.hidden = false;
}
</script>
</body>
</html>
